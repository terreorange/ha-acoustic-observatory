<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acoustic Observatory</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        padding-bottom: 16px;
      }

      h1 {
        font-size: 1.6rem;
        margin: 0;
      }

      .status {
        font-size: 0.95rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .tile {
        border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        border-radius: 8px;
        padding: 14px;
      }

      .label {
        font-size: 0.85rem;
        opacity: 0.7;
      }

      .value {
        font-size: 1.35rem;
        margin-top: 6px;
      }

      pre {
        overflow: auto;
        border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        border-radius: 8px;
        padding: 14px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Acoustic Observatory</h1>
        <div id="status" class="status">Starting...</div>
      </header>

      <section class="grid">
        <div class="tile">
          <div class="label">MQTT topic</div>
          <div id="topic" class="value">-</div>
        </div>
        <div class="tile">
          <div class="label">Messages</div>
          <div id="messages" class="value">0</div>
        </div>
        <div class="tile">
          <div class="label">Last update</div>
          <div id="last-update" class="value">-</div>
        </div>
      </section>

      <pre id="spectrum">Waiting for spectrum data...</pre>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const topicEl = document.getElementById("topic");
      const messagesEl = document.getElementById("messages");
      const lastUpdateEl = document.getElementById("last-update");
      const spectrumEl = document.getElementById("spectrum");

      function formatTime(timestamp) {
        if (!timestamp) return "-";
        return new Date(timestamp * 1000).toLocaleTimeString();
      }

      async function refresh() {
        try {
          const response = await fetch("api/state");
          const state = await response.json();

          statusEl.textContent = state.connected ? "MQTT connected" : "MQTT disconnected";
          topicEl.textContent = state.topic || "-";
          messagesEl.textContent = state.message_count || 0;
          lastUpdateEl.textContent = formatTime(state.last_message_at);

          if (state.last_spectrum) {
            spectrumEl.textContent = JSON.stringify(state.last_spectrum, null, 2);
          } else if (state.error) {
            spectrumEl.textContent = state.error;
          }
        } catch (error) {
          statusEl.textContent = "UI disconnected";
          spectrumEl.textContent = String(error);
        }
      }

      refresh();
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
