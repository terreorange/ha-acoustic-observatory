name: Acoustic Observatory
slug: ha_acoustic_observatory
description: Acoustic spectrum observatory for Home Assistant
version: 0.8.0
url: https://github.com/terreorange/ha-acoustic-observatory
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
panel_icon: mdi:waveform
panel_title: Bruit
services:
  - mqtt:need
map:
  - addon_config:rw
options:
  mqtt_topic: atom_echo_noise/spectrum/state
  wind_speed_entity: ""
  wind_gust_entity: ""
  wind_speed_threshold_kmh: 15
  wind_gust_threshold_kmh: 30
  weather_poll_interval_seconds: 30
schema:
  mqtt_topic: str
  wind_speed_entity: str?
  wind_gust_entity: str?
  wind_speed_threshold_kmh: float
  wind_gust_threshold_kmh: float
  weather_poll_interval_seconds: int(10,300)
